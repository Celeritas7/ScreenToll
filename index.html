<script type="text/babel">

function LoginScreen({ sb, theme }) {

function App({ sb, session, access, onSignOut }) {

  const week = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); const k = d.toISOString().slice(0, 10); const h = k === todayKey ? { min: Math.round(st.usedSec / 60) } : st.history[k]; return { label: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()], minutes: h ? h.min : 0, active: k === todayKey }; });
  const weekVids = Object.entries(st.history).reduce((n, [k, h]) => n + (k === todayKey ? 0 : (h.vids || 0)), st.videosWatched);

    setSession(null); setAccess(undefined);
  };
  const waiting = txt => <Shell theme={theme}><div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'monospace', fontSize: 12, fontWeight: 800, letterSpacing: '0.1em', color: 'var(--text-muted)' }}>{txt}</div></Shell>;
  if (!cfgReady) return <NotConfigured theme={theme} />;
  if (!window.supabase) return <LibraryMissing theme={theme} />;
  if (session === undefined) return waiting('OPENING THE BOOTH\u2026');
  if (!session) return <LoginScreen sb={sb} theme={theme} />;
  if (access === undefined) return waiting('CHECKING THE LIST\u2026');
  if (access && access.error) return <DeniedScreen email={session.user.email} error={access.error} onSignOut={signOut} theme={theme} />;
  if (!access) return <DeniedScreen email={session.user.email} onSignOut={signOut} theme={theme} />;
  return <App key={session.user.id} sb={sb} session={session} access={access} onSignOut={signOut} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body></html>
